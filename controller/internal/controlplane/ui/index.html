<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control plane</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <h1>Control plane</h1>
  <div id="me"></div>
  <a href="/logout" class="button quiet">Sign out</a>
</header>
<main>
  <section id="chat-panel" aria-label="Agent">
    <div class="panel-head">
      <h2>Agent</h2>
      <button id="reset" class="quiet" type="button">New conversation</button>
    </div>
    <div id="log" aria-live="polite">
      <p class="hint">Ask about the system, e.g. <em>Which stacks are unhealthy?</em> or <em>Why is grafana restarting?</em> The agent can also propose changes; they wait below for approval.</p>
    </div>
    <form id="ask">
      <textarea id="message" rows="2" placeholder="Ask the agent" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>
  <div class="side">
    <section aria-label="Changes waiting for approval">
      <div class="panel-head"><h2>Changes waiting</h2><span id="changes-count" class="count"></span></div>
      <div id="changes"><p class="hint">Loading…</p></div>
    </section>
    <section aria-label="Stacks">
      <div class="panel-head"><h2>Stacks</h2><span id="stacks-updated" class="count"></span></div>
      <table id="stacks"><thead><tr><th>Stack</th><th>Commit</th><th>Services</th></tr></thead><tbody></tbody></table>
    </section>
  </div>
</main>
</body>
</html>
