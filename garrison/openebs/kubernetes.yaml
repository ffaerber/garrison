# OpenEBS ZFS LocalPV: the apps' data on the ZFS pool of whichever machine
# holds it (docs/kubernetes.md, "More machines"). The deployer writes each
# volume itself (control-plane/internal/apply/volumes.go): a ZFSVolume that
# names the dataset and its machine, whose OpenEBS agent creates it, and a
# PersistentVolume that sends the pods there.
#
# First the StorageClass those volumes name, and the zfs DaemonSet through
# which the deployer runs ZFS, rsync and mount on each machine; then, below
# the line, OpenEBS's own objects, vendored from openebs/zfs-localpv v2.11.2,
# deploy/zfs-operator.yaml, unchanged but for the image tag (the release's,
# not the file's prerelease) and the namespace, garrison in place of
# kube-system. Its CRDs are in crds.kubernetes.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: garrison-zfs
provisioner: zfs.csi.openebs.io
parameters: { fstype: zfs, poolname: garrison/ns }
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# zfs-metrics.sh, which the zfs DaemonSet's second container runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zfs-files
  annotations:
    garrison.io/files: zfs-metrics.sh
---
# The deployer's hands on each machine: it runs `kubectl exec` here, and
# nsenter into the host's namespaces, for zfs, rsync and mount on the
# machine that holds an environment's data (apply.NodeExec). Nothing else
# uses it; the deployer itself runs without privileges.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zfs
spec:
  selector:
    matchLabels: { app: zfs }
  template:
    metadata:
      labels: { app: zfs }
    spec:
      automountServiceAccountToken: false
      hostPID: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1
      tolerations: [{ operator: Exists }]
      containers:
        - name: zfs
          image: busybox:1.37
          command: [sleep, infinity]
          securityContext: { privileged: true }
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 32Mi }
        # The machine's pools and datasets as metrics, every minute, for
        # node-exporter's textfile collector (garrison/prometheus) and the
        # Grafana dashboard Storage.
        - name: metrics
          image: busybox:1.37
          command: [sh, /files/zfs-metrics.sh]
          env:
            - { name: OUT, value: /metrics }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext: { privileged: true }
          resources:
            requests: { cpu: 1m, memory: 4Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: files, mountPath: /files, readOnly: true }
            - { name: metrics, mountPath: /metrics }
      volumes:
        - name: files
          configMap: { name: zfs-files }
        - name: metrics
          hostPath: { path: /var/lib/garrison/metrics, type: DirectoryOrCreate }
