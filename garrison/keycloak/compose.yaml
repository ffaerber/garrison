# Single sign-on. Reachable at https://keycloak.<domain>.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # Keycloak cannot read passwords from files, so a wrapper exports them.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export KC_DB_PASSWORD="$$(</run/secrets/keycloak-db-password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(</run/secrets/admin-password)"
        exec /opt/keycloak/bin/kc.sh start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://keycloak.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USER}
    secrets:
      - keycloak-db-password
      - admin-password
      # Client secrets, read by configure.sh when it creates the clients.
      - gitea-oidc-secret
      - sso-oidc-secret
      - grafana-oidc-secret
      - openwebui-oidc-secret
    networks: [system, traefik-public]
    deploy:
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefik-public
        traefik.http.routers.keycloak.rule: Host(`keycloak.${DOMAIN}`)
        traefik.http.routers.keycloak.entrypoints: websecure
        traefik.http.routers.keycloak.tls: "true"
        traefik.http.services.keycloak.loadbalancer.server.port: "8080"

secrets:
  keycloak-db-password: { external: true }
  admin-password: { external: true }
  gitea-oidc-secret: { external: true }
  sso-oidc-secret: { external: true }
  grafana-oidc-secret: { external: true }
  openwebui-oidc-secret: { external: true }

networks:
  system:
    external: true
    name: garrison-system
  traefik-public:
    external: true
