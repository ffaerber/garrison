# Actions runner for the user units: every organisation except garrison.
# It reaches Docker only through the control plane's guard, which
# refuses anything that would let a job out of its container. Jobs run on the
# builds network, a Docker network outside the cluster, where they reach
# BuildKit. They look names up in the cluster's DNS (k3s's CoreDNS, at its
# fixed address) and reach Gitea at gitea.garrison.svc.cluster.local; the
# platform's NetworkPolicies let them reach nothing else of it. Images are
# built with BuildKit, never with the host's Docker.
log:
  level: info
runner:
  file: /data/.runner
  capacity: 2
  timeout: 1h
  labels:
    - garrison-user:docker://alpine:3.22
container:
  network: garrison-builds
  options: --dns 10.43.0.10
  privileged: false
  valid_volumes: []
  # Docker comes from DOCKER_HOST (the guard) and is never handed to jobs.
  docker_host: "-"
  force_pull: false
