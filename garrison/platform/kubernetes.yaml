# Who may reach which pod of the platform, in the namespace garrison. These
# NetworkPolicies take the place of Swarm's separate networks; k3s enforces
# them (kube-router).
#
# Nothing reaches a pod here unless a policy below lets it. Two kinds of
# traffic always do: from the machine itself, so Traefik (on the host's
# network) reaches every routed service and the kubelet its probes; and
# within a pod. Pods of other namespaces, the apps' later, reach nothing
# here. Docker containers outside the cluster are known by their network's
# range: the pipelines' jobs (garrison-builds, 10.200.0.0/24, made by
# install.sh).
#
# Further down: the namespace garrison-sandboxes, where the agent service
# runs each chat's sandbox as a pod under gVisor, and what may run there.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-by-default
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The system network: Postgres, Keycloak, Gitea, the control plane's
# services, Grafana, Prometheus, Loki and Open WebUI reach each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: system
spec:
  podSelector: { matchLabels: { garrison.io/net: system } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { garrison.io/net: system } } }]
---
# Prometheus scrapes every pod's metrics port here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-prometheus
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: prometheus } } }]
---
# Gitea for the runners and their jobs: Git and the API on its port, and
# nothing else of the platform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-for-builds
spec:
  podSelector: { matchLabels: { app: gitea } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: runner } }
        - podSelector: { matchLabels: { app: user-runner } }
        - ipBlock: { cidr: 10.200.0.0/24 }
      ports: [{ port: 3000 }]
---
# The guarded Docker API of the user runner: only that runner.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guard
spec:
  podSelector: { matchLabels: { app: guard } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: user-runner } } }]
      ports: [{ port: 2375 }]
---
# The agents' browser, whose DevTools have no password: only the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser
spec:
  podSelector: { matchLabels: { app: browser } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ port: 9222 }]
---
# The public web's browser: the gateway drives it, and it reaches only the
# cluster's DNS and the agent service's internet proxy, which goes out for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webbrowser
spec:
  podSelector: { matchLabels: { app: webbrowser } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ port: 9222 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app: agents } } }]
      ports: [{ port: 8072 }]
---
# The agent service's internet proxy also goes out for the public web's
# browser, as the agent browsing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-for-webbrowser
spec:
  podSelector: { matchLabels: { app: agents } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: webbrowser } } }]
      ports: [{ port: 8072 }]
---
# SearXNG, the agents' web search, answers only the agent service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng
spec:
  podSelector: { matchLabels: { app: searxng } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: agents } } }]
      ports: [{ port: 8080 }]
---
# Loki takes the logs Alloy ships.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-from-alloy
spec:
  podSelector: { matchLabels: { app: loki } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: alloy } } }]
      ports: [{ port: 3100 }]
---
# The sandboxes reach the agent service's LLM and tools (8071) and its
# internet proxy (8072), not its API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-for-sandboxes
spec:
  podSelector: { matchLabels: { app: agents } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: garrison-sandboxes } } }]
      ports: [{ port: 8071 }, { port: 8072 }]
---
# The login proxy waits for Keycloak's realm before it starts (its init
# container asks Keycloak directly); it signs people in through Traefik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-for-sso
spec:
  podSelector: { matchLabels: { app: keycloak } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: sso } } }]
      ports: [{ port: 8080 }]

# ---------- the agents' sandboxes ----------
---
apiVersion: v1
kind: Namespace
metadata:
  name: garrison-sandboxes
---
# gVisor: the sandboxes' processes meet its kernel, in user space, before
# Linux's. containerd knows it as the runtime runsc (install.sh).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
# The agent service may start, watch, attach to and remove pods there, and
# keep the sandboxes' workspaces (claims), and nothing else; the admission
# policy below decides which pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents
  namespace: garrison-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/attach]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents
  namespace: garrison-sandboxes
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agents }
subjects: [{ kind: ServiceAccount, name: agents, namespace: garrison }]
---
# Nothing reaches a sandbox; a sandbox reaches the cluster's DNS and the
# agent service's LLM, tools and internet proxy, and nothing else: no
# platform, no app, no internet but through the proxy, as far as the
# agent's agent.yaml says.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxes
  namespace: garrison-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: garrison } }, podSelector: { matchLabels: { app: agents } } }]
      ports: [{ port: 8071 }, { port: 8072 }]
---
# What a pod there must be: a sandbox. Kubernetes checks every pod and claim
# made in garrison-sandboxes against these rules (CEL) and refuses the rest,
# so the agent service's rights there let it start sandboxes only, whatever
# it asks for. It takes the place of the sandbox guard, which checked
# Docker containers the same way.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: garrison-sandboxes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: c
      expression: "object.spec.containers[0]"
    # The claim of the unit's media share here (the deployer's, apply.MediaClaim).
    - name: media
      expression: "'media-' + object.metadata.labels[?'garrison.unit'].orValue('-')"
  validations:
    - expression: "object.metadata.labels[?'garrison.sandbox'].orValue('') == 'true'"
      message: "a sandbox carries the label garrison.sandbox=true"
    - expression: "object.spec.runtimeClassName == 'gvisor'"
      message: "a sandbox runs under gVisor (runtimeClassName gvisor)"
    - expression: "size(object.spec.containers) == 1 && !has(object.spec.initContainers) && !has(object.spec.ephemeralContainers)"
      message: "a sandbox has one container"
    - expression: "variables.c.image.startsWith('git.${DOMAIN}/garrison/sandbox:')"
      message: "a sandbox runs the sandbox image"
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: "no host network"
    - expression: "(!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "no host processes"
    - expression: "!has(variables.c.securityContext) || ((!has(variables.c.securityContext.privileged) || !variables.c.securityContext.privileged) && (!has(variables.c.securityContext.capabilities) || !has(variables.c.securityContext.capabilities.add)))"
      message: "no privileges, no added capabilities"
    - expression: "!has(variables.c.ports) || variables.c.ports.all(p, !has(p.hostPort))"
      message: "no ports on the host"
    - expression: "has(variables.c.resources.limits) && has(variables.c.resources.limits.memory) && quantity(variables.c.resources.limits.memory).compareTo(quantity('2Gi')) <= 0"
      message: "a sandbox has a memory limit of at most 2Gi"
    - expression: "!has(object.spec.automountServiceAccountToken) ? false : !object.spec.automountServiceAccountToken"
      message: "a sandbox gets no token of the Kubernetes API"
    - expression: "object.spec.volumes.all(v, has(v.persistentVolumeClaim) && (v.persistentVolumeClaim.claimName == object.metadata.name || v.persistentVolumeClaim.claimName == variables.media))"
      message: "a sandbox mounts only its own workspace and its unit's media library"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: garrison-sandboxes
spec:
  policyName: garrison-sandboxes
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels: { kubernetes.io/metadata.name: garrison-sandboxes }
