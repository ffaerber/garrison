tls:
  stores:
    default:
      defaultCertificate:
        certFile: /run/secrets/tls.crt
        keyFile: /run/secrets/tls.key

http:
  routers:
    # Prometheus's metrics, for pods only (Prometheus): Traefik is on the
    # host's network, so the entry point is on the machine's address too.
    metrics:
      entryPoints: [metrics]
      rule: PathPrefix(`/metrics`)
      service: prometheus@internal
      middlewares: [pods-only]
  middlewares:
    pods-only:
      ipAllowList:
        sourceRange: [10.42.0.0/16]
    # Login check for private environments: every request is checked with
    # the login proxy (04-sso). Without a session the proxy redirects to
    # Keycloak. If the proxy is down, requests fail; nothing is let through.
    # The address is the full name of the Service in the namespace garrison,
    # which no unit can imitate.
    # A Keycloak access token in Authorization also passes the check (an
    # agent's browser, as the person); it is removed before the request
    # reaches the app, so no app can reuse it elsewhere.
    sso:
      chain:
        middlewares: [sso-check, sso-drop-token]
    sso-drop-token:
      headers:
        customRequestHeaders:
          Authorization: ""
    sso-check:
      forwardAuth:
        address: http://sso.garrison.svc.cluster.local:4180/
        authResponseHeaders:
          - X-Auth-Request-User
          - X-Auth-Request-Email
          - X-Auth-Request-Preferred-Username
