# Logs. Alloy ships the logs of every container to Loki, labelled with their
# Swarm stack and service. Loki has no login of its own, so it is not routed:
# Grafana reads it over the system network.
services:
  loki:
    image: grafana/loki:3.6.0
    user: root   # the dataset is owned by root
    command: [-config.file=/etc/loki/local-config.yaml]
    volumes:
      - type: bind
        source: /garrison/system/loki
        target: /loki
    networks: [default, system]
    deploy:
      placement:
        constraints: [node.role == manager]

  alloy:
    image: grafana/alloy:v1.12.0
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    configs:
      - source: alloy
        target: /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      mode: global

configs:
  alloy:
    name: alloy-${CONFIG_HASH}
    file: ./config.alloy

networks:
  system:
    external: true
    name: garrison-system
