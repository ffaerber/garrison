# Login proxy: the login check for private environments and for tools without
# their own login. Traefik asks it about every request to a route that uses the
# `sso@file` middleware (traefik/dynamic.yaml); it sends people without a
# session to Keycloak.
apiVersion: v1
kind: Service
metadata:
  name: sso
spec:
  selector: { app: sso }
  ports: [{ name: http, port: 4180 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sso
spec:
  rules:
    - host: sso.${DOMAIN}
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: sso, port: { name: http } } } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso
spec:
  replicas: 1
  selector: { matchLabels: { app: sso } }
  template:
    metadata:
      labels: { app: sso }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
          env:
            - { name: OAUTH2_PROXY_HTTP_ADDRESS, value: "0.0.0.0:4180" }
            - { name: OAUTH2_PROXY_PROVIDER, value: oidc }
            - { name: OAUTH2_PROXY_OIDC_ISSUER_URL, value: "https://keycloak.${DOMAIN}/realms/garrison" }
            - { name: OAUTH2_PROXY_PROVIDER_CA_FILES, value: /run/secrets/tls.crt }
            - { name: OAUTH2_PROXY_CLIENT_ID, value: sso }
            - { name: OAUTH2_PROXY_CLIENT_SECRET_FILE, value: /run/secrets/sso-oidc-secret }
            - { name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD, value: S256 }
            - { name: OAUTH2_PROXY_REDIRECT_URL, value: "https://sso.${DOMAIN}/oauth2/callback" }
            - { name: OAUTH2_PROXY_COOKIE_SECRET_FILE, value: /run/secrets/sso-cookie-secret }
            # One session for every hostname of the installation.
            - { name: OAUTH2_PROXY_COOKIE_DOMAINS, value: ".${DOMAIN}" }
            - { name: OAUTH2_PROXY_WHITELIST_DOMAINS, value: ".${DOMAIN}" }
            - { name: OAUTH2_PROXY_EMAIL_DOMAINS, value: "*" }
            # Answer Traefik's check itself: 202 with a session, a redirect without.
            - { name: OAUTH2_PROXY_UPSTREAMS, value: "static://202" }
            - { name: OAUTH2_PROXY_REVERSE_PROXY, value: "true" }
            - { name: OAUTH2_PROXY_SET_XAUTHREQUEST, value: "true" }
            - { name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON, value: "true" }
            # A Keycloak access token for this client (Open WebUI's carry it as an
            # audience) also counts as signed in: an agent's browser, as the person.
            - { name: OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS, value: "true" }
          ports: [{ containerPort: 4180 }]
          volumeMounts: [{ name: secrets, mountPath: /run/secrets, readOnly: true }]
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
            periodSeconds: 5
      volumes:
        - name: secrets
          projected:
            sources:
              - secret: { name: sso-oidc-secret }
              - secret: { name: sso-cookie-secret }
              - secret: { name: tls, items: [{ key: tls.crt, path: tls.crt }] }
