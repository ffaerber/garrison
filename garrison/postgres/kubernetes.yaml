# Shared database for Keycloak, Gitea, Grafana and the dashboard's feed
# (garrison, made by configure.sh). One pod, its data on the ZFS dataset
# /garrison/system/postgres.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-files
  annotations:
    garrison.io/files: init-databases.sh
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
# A Deployment, not a StatefulSet: one pod on a host directory needs no
# stable identity, and a StatefulSet does not replace a pod that never became
# ready when its template changes (it waits for it), so a broken rollout
# would stay broken.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  # One Postgres on its data at a time.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres, garrison.io/net: system }
      annotations: { garrison.io/config-hash: "${CONFIG_HASH}" }
    spec:
      automountServiceAccountToken: false
      # As the image's user postgres (70) from the start: its entrypoint,
      # started as root, drops to that user with gosu, which spun at full CPU
      # in this pod and never got there.
      securityContext: { runAsUser: 70, runAsGroup: 70, fsGroup: 70 }
      initContainers:
        # The dataset is made by root; Postgres needs to own its data.
        - name: own-data
          image: postgres:17-alpine
          command: [chown, "70:70", /var/lib/postgresql/data]
          securityContext: { runAsUser: 0, runAsGroup: 0 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres-password }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            # Over TCP: during first-run initialisation Postgres listens on the socket only.
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres] }
            periodSeconds: 5
          # Recovery after an unclean stop can take a while.
          startupProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres] }
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres] }
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - { name: data, hostPath: { path: /garrison/system/postgres, type: Directory } }
        - name: secrets
          projected:
            sources:
              - secret: { name: postgres-password }
              - secret: { name: keycloak-db-password }
              - secret: { name: gitea-db-password }
              - secret: { name: grafana-db-password }
              - secret: { name: garrison-db-password }
        - name: init
          configMap:
            name: postgres-files
            items: [{ key: init-databases.sh, path: 10-databases.sh, mode: 0555 }]
