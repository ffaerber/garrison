# Metrics and alerts. Prometheus scrapes every node (node-exporter), every
# container (cAdvisor) and the deployer's view of the Swarm services, and
# evaluates alerts.yml; Alertmanager hands what fires to the agent service.
# Neither has a login of its own, so neither is routed: Grafana reads
# Prometheus over the system network.
services:
  prometheus:
    image: prom/prometheus:v3.7.3
    user: root   # the dataset is owned by root
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: alerts
        target: /etc/prometheus/alerts.yml
    volumes:
      - type: bind
        source: /garrison/system/prometheus
        target: /prometheus
    networks: [default, system]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=   # one machine: no peers to gossip with
    configs:
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - alerts-token
    # The agent service on the system network.
    networks: [default, system]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 60

  node-exporter:
    image: prom/node-exporter:v1.10.2
    command: [--path.rootfs=/host]
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind: { propagation: rslave }
    deploy:
      mode: global

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6   # v0.54+ reads containers under the containerd image store
    command: [--docker_only=true, --housekeeping_interval=30s]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    deploy:
      mode: global

configs:
  prometheus:
    name: prometheus-${CONFIG_HASH}
    file: ./prometheus.yml
  alerts:
    name: prometheus-alerts-${CONFIG_HASH}
    file: ./alerts.yml
  alertmanager:
    name: alertmanager-${CONFIG_HASH}
    file: ./alertmanager.yml

secrets:
  alerts-token: { external: true }

networks:
  system:
    external: true
    name: garrison-system
