global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  # The headless Service resolves to every node's node-exporter.
  - job_name: node
    dns_sd_configs: [{ names: [node-exporter.garrison.svc.cluster.local], type: A, port: 9100 }]
  # Every container's CPU, memory, network and disk, from each node's
  # kubelet, through the API server. They name namespace, pod and container;
  # garrison_pod_info (the deployer's) adds the stack and service.
  - job_name: kubelet
    scheme: https
    authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
    tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
    kubernetes_sd_configs: [{ role: node }]
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
  - job_name: traefik
    static_configs: [{ targets: ["traefik:8082"] }]
  # The deployer: each workload's desired, running and failed pods,
  # labelled with its unit, app and environment, and which pods it has.
  - job_name: garrison
    static_configs: [{ targets: ["deployer:8090"] }]
