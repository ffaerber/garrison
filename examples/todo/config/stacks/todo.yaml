# todo/config/stacks/todo.yaml: the todo app of the namespace todo, a web
# app and its database. Its code is the repo todo/app (source);
# the branch main is at https://todo.<domain>, a branch dev at
# https://dev-todo.<domain>; both behind the installation's sign-in. Each
# has its own database.
source: app
entrypoint: web

services:
  web:
    # Built by the pipeline (.gitea/workflows/pipeline.yaml) for each commit;
    # the deployer deploys a commit once its image exists.
    image: "{{registry}}/todo/app:{{commit}}"
    port: 8080
    env:
      DATABASE_HOST: db
      DATABASE_NAME: todo
      DATABASE_USER: todo
      DATABASE_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    resources: { memory: 128Mi }

  db:
    image: postgres:17-alpine
    env:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    volumes:
      data: { dataset: todo-db, size: 2Gi, path: /var/lib/postgresql/data }
    secrets: [db-password]
    resources: { memory: 256Mi }

environments:
  main: { private: true }
  dev: { private: true }
