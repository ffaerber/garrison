# homepage/config/stacks/homepage.yaml: the homepage of the namespace
# homepage, one static page. Its code is the repo homepage/app (source); the
# branch main is at https://homepage.<domain>, open to everyone.
source: app
entrypoint: web

services:
  web:
    # Built by the pipeline (.gitea/workflows/pipeline.yaml) for each commit;
    # the deployer deploys a commit once its image exists.
    image: "{{registry}}/homepage/app:{{commit}}"
    port: 8080
    resources: { memory: 64Mi }

environments:
  main: {}
