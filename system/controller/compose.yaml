# The controller: deploys every repo of the `system` organisation that holds a
# compose.yaml, itself included. Its image is built from this repo by Gitea
# Actions (.gitea/workflows/build.yaml), which then sets the tag below by
# committing here; the running controller applies that and replaces itself.
services:
  controller:
    image: git.${DOMAIN}/system/controller:bootstrap
    command:
      - serve
      - -gitea=http://gitea_gitea:3000
      - -password-file=/run/secrets/admin-password
      # ZFS runs on the host; the controller reaches it through a short-lived
      # privileged container of its own image.
      - -host-exec=git.${DOMAIN}/system/controller:bootstrap
      # Keeps dashboards/*.json of the repos in Grafana.
      - -grafana=http://grafana_grafana:3000
    secrets:
      - admin-password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      # Shared with the controller CLI on the host: checkouts, state and lock.
      - /var/lib/homecloud/controller:/var/lib/homecloud/controller
    networks: [system]
    deploy:
      placement:
        constraints: [node.role == manager]

  # The control plane: the MCP server behind Open WebUI's agents, and the
  # sync that keeps one agent per namespace there. Not routed: only Open WebUI
  # calls it, over the system network, with each person's Keycloak token.
  controlplane:
    image: git.${DOMAIN}/system/controller:bootstrap
    command:
      - controlplane
      - -password-file=/run/secrets/admin-password
    secrets:
      - admin-password
      - { source: tls-cert, target: tls.crt }
    volumes:
      # For stacks and logs. Read-only Docker access would need a proxy; the socket gives full access.
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      - /var/lib/homecloud/controller:/var/lib/homecloud/controller:ro
    # Gitea, Prometheus and Open WebUI on the system network; Keycloak's keys at
    # its public name through Traefik.
    networks: [system, traefik-public]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 60
    deploy:
      placement:
        constraints: [node.role == manager]

secrets:
  admin-password: { external: true }
  tls-cert: { external: true }

networks:
  system:
    external: true
    name: homecloud-system
  traefik-public:
    external: true
