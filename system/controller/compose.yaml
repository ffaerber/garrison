# The controller: deploys every repo of the `system` organisation that holds a
# compose.yaml, itself included. Its image is built from this repo by Gitea
# Actions (.gitea/workflows/build.yaml), which then sets the tag below by
# committing here; the running controller applies that and replaces itself.
services:
  controller:
    image: git.${DOMAIN}/system/controller:bootstrap
    command:
      - serve
      - -gitea=http://gitea_gitea:3000
      - -password-file=/run/secrets/admin-password
      # ZFS runs on the host; the controller reaches it through a short-lived
      # privileged container of its own image.
      - -host-exec=git.${DOMAIN}/system/controller:bootstrap
    secrets:
      - admin-password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      # Shared with the controller CLI on the host: checkouts, state and lock.
      - /var/lib/homecloud/controller:/var/lib/homecloud/controller
    networks: [system]
    deploy:
      placement:
        constraints: [node.role == manager]

  # The web control plane at https://controlplane.<domain>: Keycloak sign-in,
  # stacks, changes waiting for approval, and the operator agent.
  controlplane:
    image: git.${DOMAIN}/system/controller:bootstrap
    command:
      - controlplane
      - -password-file=/run/secrets/admin-password
    secrets:
      - admin-password
      - controlplane-oidc-secret
      - { source: tls-cert, target: tls.crt }
    volumes:
      # Read-only Docker access would need a proxy; the socket gives full access.
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      # The LLM key, root-only on the host; replaced in place, read on every call.
      - /etc/homecloud/llm-api-key:/etc/homecloud/llm-api-key:ro
      - /var/lib/homecloud/controller:/var/lib/homecloud/controller:ro
    # Gitea on the system network; Keycloak at its public name through Traefik.
    networks: [system, traefik-public]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 60
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefik-public
        traefik.http.routers.controlplane.rule: Host(`controlplane.${DOMAIN}`)
        traefik.http.routers.controlplane.entrypoints: websecure
        traefik.http.routers.controlplane.tls: "true"
        traefik.http.services.controlplane.loadbalancer.server.port: "8080"

secrets:
  admin-password: { external: true }
  controlplane-oidc-secret: { external: true }
  tls-cert: { external: true }

networks:
  system:
    external: true
    name: homecloud-system
  traefik-public:
    external: true
