# Every alert goes to the agent service, which records it in the dashboard's
# feed and starts the routines waiting for it. It sends the token of the
# secret alerts-token: the agents' sandboxes can reach that service too.
route:
  receiver: homecloud
  group_by: [alertname, namespace, app, environment, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: homecloud
    webhook_configs:
      - url: http://control-plane_agents:8073/alerts
        send_resolved: true
        max_alerts: 50
        http_config:
          authorization:
            credentials_file: /run/secrets/alerts-token
