global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  # tasks.<service> resolves to every container of a service, one per node.
  - job_name: node
    dns_sd_configs: [{ names: [tasks.node-exporter], type: A, port: 9100 }]
  - job_name: cadvisor
    dns_sd_configs: [{ names: [tasks.cadvisor], type: A, port: 8080 }]
