global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  # tasks.<service> resolves to every container of a service, one per node.
  - job_name: node
    dns_sd_configs: [{ names: [tasks.node-exporter], type: A, port: 9100 }]
  - job_name: cadvisor
    dns_sd_configs: [{ names: [tasks.cadvisor], type: A, port: 8080 }]
  - job_name: traefik
    static_configs: [{ targets: ["traefik_traefik:8082"] }]
  # The deployer: each Swarm service's desired, running and failed tasks,
  # labelled with its namespace, app and environment.
  - job_name: garrison
    static_configs: [{ targets: ["control-plane_deployer:8090"] }]
