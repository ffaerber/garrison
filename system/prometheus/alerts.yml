# The home cloud's alerts. Each names the namespace it concerns (apps carry
# it; the platform's own alerts have none and go to system), and Alertmanager
# hands it to the agent service: it appears in the dashboard's feed for the
# namespace's people, and starts the routines that wait for it (on_alert in
# agents/<name>/agent.yaml).
groups:
  - name: homecloud
    rules:
      # From the deployer's metrics, which read Swarm: cAdvisor sees only
      # running containers, so an app that exits at start hardly shows there.
      - alert: ServiceFailing
        expr: homecloud_service_failed_tasks >= 3
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} keeps failing: {{ $value }} tasks failed in 10 minutes"
          description: "The service {{ $labels.service }} of the app {{ $labels.app }} ({{ $labels.environment }}) in {{ $labels.namespace }} starts and fails again. Its tasks (stack_status) and logs (service_logs) say why."
      - alert: ServiceDown
        expr: homecloud_service_replicas_running < homecloud_service_replicas_desired
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} runs {{ $value }} of its tasks"
          description: "The service {{ $labels.service }} of the app {{ $labels.app }} ({{ $labels.environment }}) in {{ $labels.namespace }} has run fewer tasks than it should for 5 minutes."
      # An app's entrypoint answers with server errors. Traefik names its
      # service after the hostname, the app's stack.
      - alert: HighErrorRate
        expr: |
          (
            (
              sum by (stack) (label_replace(rate(traefik_service_requests_total{code=~"5.."}[5m]), "stack", "$1", "service", "(.+)@swarm"))
              / sum by (stack) (label_replace(rate(traefik_service_requests_total[5m]), "stack", "$1", "service", "(.+)@swarm"))
              > 0.2
            )
            and on (stack) (sum by (stack) (label_replace(rate(traefik_service_requests_total[5m]), "stack", "$1", "service", "(.+)@swarm")) > 0.05)
          )
          * on (stack) group_left (namespace, app, environment) group by (stack, namespace, app, environment) (homecloud_service_replicas_desired{namespace!="system"})
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.stack }} answers {{ $value | humanizePercentage }} of its requests with a server error"
          description: "The app {{ $labels.app }} ({{ $labels.environment }}) in {{ $labels.namespace }} has answered more than a fifth of its requests with 5xx for 5 minutes."
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs"} / node_filesystem_size_bytes < 0.1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
          description: "The filesystem {{ $labels.mountpoint }} ({{ $labels.device }}) on {{ $labels.instance }} is more than 90% full."
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus cannot read {{ $labels.job }} at {{ $labels.instance }}"
          description: "Its metrics have not answered for 5 minutes."
