# The control plane: one image, built from this repo by Gitea Actions
# (.gitea/workflows/build.yaml), which then sets the tag below by committing
# here; the running deployer applies that and replaces itself.
services:
  # The deployer: deploys every repo of the `system` organisation that holds
  # a compose.yaml, this one last, and the apps of every other namespace.
  deployer:
    image: git.${DOMAIN}/system/control-plane:bootstrap
    command:
      - deploy
      - -gitea=http://gitea_gitea:3000
      - -password-file=/run/secrets/admin-password
      # ZFS runs on the host; the deployer reaches it through a short-lived
      # privileged container of its own image.
      - -host-exec=git.${DOMAIN}/system/control-plane:bootstrap
      # Keeps dashboards/*.json of the repos in Grafana.
      - -grafana=http://grafana_grafana:3000
      # Gitea calls this on every push, pull request and finished pipeline
      # run, so changes deploy at once; the deployer still checks every 15 s.
      - -listen=:8090
      - -hook-url=http://control-plane_deployer:8090/hook
    secrets:
      - admin-password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      # Shared with the CLI on the host: checkouts, state and lock.
      - /var/lib/homecloud/deployer:/var/lib/homecloud/deployer
    networks: [system]
    deploy:
      placement:
        constraints: [node.role == manager]

  # The gateway: the MCP server behind the agents, and the syncs that keep
  # each namespace's agents, channel, members and build account. Not routed:
  # only the agent service calls it, over the system network, with each
  # person's Keycloak token.
  gateway:
    image: git.${DOMAIN}/system/control-plane:bootstrap
    command:
      - gateway
      - -password-file=/run/secrets/admin-password
      # Wakes the build account, member and agent syncs on Gitea's events.
      - -hook-url=http://control-plane_gateway:8080/hook
    secrets:
      - admin-password
      - { source: tls-cert, target: tls.crt }
    volumes:
      # For stacks and logs. Read-only Docker access would need a proxy; the socket gives full access.
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      - /var/lib/homecloud/deployer:/var/lib/homecloud/deployer:ro
    # Gitea, Prometheus and Open WebUI on the system network; Keycloak's keys at
    # its public name through Traefik; the browser on its own network.
    networks: [system, traefik-public, browser]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 60
    deploy:
      placement:
        constraints: [node.role == manager]

  # The agent service: the OpenAI-compatible API Open WebUI talks to. Its
  # models are the namespaces' agents. Each chat with an agent runs in a
  # sandbox of its own (the image below, built with this one): Pi, the agent
  # harness, with a workspace kept in a volume per chat. The agent service
  # passes on the LLM, whose key only it has, and the agent's tools from the
  # gateway, acting as the person chatting (Open WebUI sends their Keycloak
  # token).
  agents:
    image: git.${DOMAIN}/system/control-plane:bootstrap
    command:
      - agents
      - -password-file=/run/secrets/admin-password
      - -sandbox-image=git.${DOMAIN}/system/sandbox:bootstrap
    secrets:
      - admin-password
      - { source: tls-cert, target: tls.crt }
    volumes:
      - /etc/homecloud/install.env:/etc/homecloud/install.env:ro
      - /etc/homecloud/llm-api-key:/etc/homecloud/llm-api-key:ro
    # Gitea, the gateway and Open WebUI on the system network; Keycloak's keys
    # at its public name through Traefik; the LLM outside; the sandboxes, and
    # Docker for them through their guard.
    networks: [system, traefik-public, sandboxes, sandbox-guard]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:8070/healthz"]
      interval: 5s
      timeout: 3s
      retries: 60
    deploy:
      placement:
        constraints: [node.role == manager]

  # The Docker API for the agent service: only sandboxes, i.e. containers of
  # the sandbox image, labelled, with memory and process limits, on the
  # sandboxes network, with a volume of their own.
  sandbox-guard:
    image: git.${DOMAIN}/system/control-plane:bootstrap
    command:
      - guard
      - -listen=:2375
      - -network=homecloud-sandboxes
      - -volumes=homecloud-agent-
      - -image=git.${DOMAIN}/system/sandbox
      - -label=homecloud.sandbox
      - -max-memory=2147483648
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [sandbox-guard]
    deploy:
      placement:
        constraints: [node.role == manager]

  # Headless Chrome for the agents' screenshot tool, driven by the gateway.
  # Its only network reaches the gateway and Traefik, and every name it looks
  # up goes to Traefik, so it can load the installation's pages and nothing
  # else; the gateway also refuses its requests to other names. Its DevTools
  # port has no password: nothing but the gateway shares its network. The
  # image's own start script splits arguments, so Chrome is started here.
  browser:
    image: chromedp/headless-shell:156.0.8078.48
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223 &
        exec /headless-shell/headless-shell --no-sandbox --use-gl=angle --use-angle=swiftshader \
          --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 \
          --ignore-certificate-errors '--host-resolver-rules=MAP * traefik_traefik'
    networks: [browser]
    deploy:
      resources:
        limits: { memory: 1G }

  # The Docker API for the user runner: only what running jobs needs.
  guard:
    image: git.${DOMAIN}/system/control-plane:bootstrap
    command: [guard, -listen=:2375, -network=homecloud-builds]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [runner-guard]
    deploy:
      placement:
        constraints: [node.role == manager]

  # Actions runner of the user namespaces (see user-runner.yaml). The system
  # organisation has its own runner, which may use Docker directly.
  user-runner:
    image: gitea/act_runner:0.2.13
    environment:
      CONFIG_FILE: /etc/act_runner/config.yaml
      DOCKER_HOST: tcp://guard:2375
      GITEA_INSTANCE_URL: http://gitea_gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/gitea-user-runner-token
      GITEA_RUNNER_NAME: homecloud-user
      GITEA_RUNNER_LABELS: homecloud-user:docker://alpine:3.22
    configs:
      - source: user-runner
        target: /etc/act_runner/config.yaml
    secrets:
      - gitea-user-runner-token
    volumes:
      - type: bind
        source: /homecloud/system/user-runner
        target: /data
    # The guard on its own network, which jobs are not on; Gitea on the builds network.
    networks: [runner-guard, builds]

configs:
  user-runner:
    name: user-runner-${CONFIG_HASH}
    file: ./user-runner.yaml

secrets:
  admin-password: { external: true }
  tls-cert: { external: true }
  gitea-user-runner-token: { external: true }

networks:
  system:
    external: true
    name: homecloud-system
  traefik-public:
    external: true
  builds:
    external: true
    name: homecloud-builds
  # The browser, the gateway and Traefik; made by the Traefik stack.
  browser:
    external: true
    name: homecloud-browser
  # Only the user runner and the guard.
  runner-guard:
    driver: overlay
    internal: true
  # The agents' sandboxes, plain containers, and the agent service: nothing
  # on it reaches beyond the cluster.
  sandboxes:
    name: homecloud-sandboxes
    driver: overlay
    internal: true
    attachable: true
  # Only the agent service and its guard.
  sandbox-guard:
    driver: overlay
    internal: true
