# Routing and TLS. Provides the names in platform/contracts.
services:
  traefik:
    image: traefik:v3.6
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --ping=true
      # Metrics for Prometheus on an entry point that is not published.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
    ports:
      - { target: 80, published: 80, mode: host }
      - { target: 443, published: 443, mode: host }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: dynamic
        target: /etc/traefik/dynamic.yaml
    secrets:
      - { source: tls-cert, target: tls.crt }
      - { source: tls-key, target: tls.key }
    networks:
      traefik-public:
        # Containers reach Keycloak at its public name through Traefik, so
        # tokens and discovery use one URL inside and outside the cluster.
        aliases: ["keycloak.${DOMAIN}"]
      # Prometheus scrapes the metrics entry point here.
      system: {}
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      placement:
        constraints: [node.role == manager]

configs:
  dynamic:
    name: traefik-dynamic-${CONFIG_HASH}
    file: ./dynamic.yaml

secrets:
  tls-cert: { external: true }
  tls-key: { external: true }

networks:
  traefik-public:
    external: true
  system:
    external: true
    name: homecloud-system
