# Gitea Actions runner for the `system` organisation: builds the platform's
# own images, such as the deployer. It is registered for that organisation
# only, because its jobs reach the Docker daemon, which is root on this
# machine, and only root admins can write to repos in `system`.
services:
  runner:
    image: gitea/act_runner:0.2.13
    environment:
      CONFIG_FILE: /etc/act_runner/config.yaml
      GITEA_INSTANCE_URL: http://gitea_gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/gitea-runner-token
      GITEA_RUNNER_NAME: homecloud
      GITEA_RUNNER_LABELS: homecloud:docker://docker:29-cli
    configs:
      - source: config
        target: /etc/act_runner/config.yaml
    secrets:
      - gitea-runner-token
    volumes:
      - type: bind
        source: /homecloud/system/gitea-runner
        target: /data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [system]
    deploy:
      placement:
        constraints: [node.role == manager]

configs:
  config:
    name: runner-config-${CONFIG_HASH}
    file: ./config.yaml

secrets:
  gitea-runner-token: { external: true }

networks:
  system:
    external: true
    name: homecloud-system
