# Code, config and history. Reachable at https://git.<domain>.
services:
  gitea:
    image: gitea/gitea:1.25
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/gitea-db-password
      GITEA__server__DOMAIN: git.${DOMAIN}
      GITEA__server__ROOT_URL: https://git.${DOMAIN}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__security__INSTALL_LOCK: "true"
      # Builds run on the runner of the system organisation (system/runner) and
      # on the user runner of every other namespace (system/controller).
      GITEA__actions__ENABLED: "true"
      GITEA__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.packages,repo.actions
      # Namespaces are made by root admins only.
      GITEA__admin__DISABLE_REGULAR_ORG_CREATION: "true"
      # The container registry, for images built here.
      GITEA__packages__ENABLED: "true"
      # Nothing is visible without signing in.
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      # People sign in through Keycloak; an account is created on first login.
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      # Trust the installation's certificate when calling Keycloak.
      SSL_CERT_FILE: /run/secrets/tls.crt
    secrets:
      - gitea-db-password
      - gitea-oidc-secret
      - { source: tls-cert, target: tls.crt }
    volumes:
      - type: bind
        source: /homecloud/system/gitea
        target: /data
    # The builds network: the user runner and its jobs reach Gitea there.
    networks: [system, traefik-public, builds]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:3000/api/healthz]
      interval: 5s
      timeout: 3s
      retries: 60
    deploy:
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefik-public
        traefik.http.routers.git.rule: Host(`git.${DOMAIN}`)
        traefik.http.routers.git.entrypoints: websecure
        traefik.http.routers.git.tls: "true"
        traefik.http.services.git.loadbalancer.server.port: "3000"

secrets:
  gitea-db-password: { external: true }
  gitea-oidc-secret: { external: true }
  tls-cert: { external: true }

networks:
  system:
    external: true
    name: homecloud-system
  traefik-public:
    external: true
  builds:
    external: true
    name: homecloud-builds
