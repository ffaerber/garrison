# Chat at https://chat.<domain>. People sign in through Keycloak; root admins
# become Open WebUI admins, everyone else a user. Each namespace's agents
# (folders under agents/ in its repo config) are models here, kept in sync by
# the gateway, whose MCP tools act with the rights of the person chatting:
# Open WebUI forwards their Keycloak token.
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    # Open WebUI reads secrets only from its environment, so a wrapper exports
    # them. Python's HTTP clients bring their own CA bundles; the installation's
    # certificate is added to each so Keycloak's URL is trusted.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        export OAUTH_CLIENT_SECRET="$$(</run/secrets/openwebui-oidc-secret)"
        export WEBUI_SECRET_KEY="$$(</run/secrets/openwebui-secret-key)"
        export WEBUI_ADMIN_PASSWORD="$$(</run/secrets/admin-password)"
        export OPENAI_API_KEY="$$(cat /etc/homecloud/llm-api-key)"
        cat /etc/ssl/certs/ca-certificates.crt /run/secrets/tls.crt > /tmp/ca.pem
        certifi=$$(python -c 'import certifi; print(certifi.where())')
        grep -q 'homecloud' "$$certifi" || { echo '# homecloud'; cat /run/secrets/tls.crt; } >> "$$certifi"
        export SSL_CERT_FILE=/tmp/ca.pem REQUESTS_CA_BUNDLE=/tmp/ca.pem
        exec bash start.sh
    environment:
      WEBUI_URL: https://chat.${DOMAIN}
      WEBUI_NAME: Home Cloud
      # Configuration comes from here, i.e. from Git, on every start.
      ENABLE_PERSISTENT_CONFIG: "False"
      # Local admin for the gateway's sync. People never use it.
      WEBUI_ADMIN_EMAIL: installer@${DOMAIN}
      WEBUI_ADMIN_NAME: Gateway (not the agent)
      ENABLE_LOGIN_FORM: "False"
      ENABLE_SIGNUP: "False"
      # Sign-in through Keycloak.
      ENABLE_OAUTH_SIGNUP: "True"
      OAUTH_CLIENT_ID: openwebui
      OPENID_PROVIDER_URL: https://keycloak.${DOMAIN}/realms/homecloud/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://chat.${DOMAIN}/oauth/oidc/callback
      OAUTH_PROVIDER_NAME: Keycloak
      OAUTH_SCOPES: openid email profile
      OAUTH_CODE_CHALLENGE_METHOD: S256
      # Show people by their username, as Gitea and Grafana do; kept current at each sign-in.
      OAUTH_USERNAME_CLAIM: preferred_username
      OAUTH_UPDATE_NAME_ON_LOGIN: "True"
      ENABLE_OAUTH_ROLE_MANAGEMENT: "True"
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ALLOWED_ROLES: "*"
      OAUTH_ADMIN_ROLES: root-admins
      DEFAULT_USER_ROLE: user
      # The LLM, OpenAI-compatible. The key comes from /etc/homecloud/llm-api-key.
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: ${LLM_BASE_URL:-https://ollama.com/v1}
      DEFAULT_MODELS: system/operator
      # One channel per namespace, kept by the gateway: the team chat
      # where people mention the namespace's agent.
      ENABLE_CHANNELS: "True"
      # The gateway's tools, over MCP, with each person's own Keycloak token.
      # X-Homecloud-Agent names the agent being chatted with, so the gateway
      # serves only that agent's tools. Set here, not through the API: with
      # persistent config off, settings made through the API are lost on
      # restart. Swarm expands Go templates in the environment, so the
      # placeholder is written as a template string that yields {{MODEL_ID}}.
      TOOL_SERVER_CONNECTIONS: >-
        [{"type": "mcp", "url": "http://control-plane_gateway:8080/mcp", "auth_type": "system_oauth",
          "key": "", "path": "", "spec_type": "url", "spec": "",
          "headers": {"X-Homecloud-Agent": "{{`{{MODEL_ID}}`}}"},
          "config": {"enable": true, "access_grants": [{"principal_type": "user", "principal_id": "*", "permission": "read"}]},
          "info": {"id": "homecloud", "name": "Home Cloud", "description": "The tools of the agent you talk to, acting as you."}}]
      ENABLE_DIRECT_CONNECTIONS: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    secrets:
      - openwebui-oidc-secret
      - openwebui-secret-key
      - admin-password
      - { source: tls-cert, target: tls.crt }
    volumes:
      - type: bind
        source: /homecloud/system/openwebui
        target: /app/backend/data
      - /etc/homecloud/llm-api-key:/etc/homecloud/llm-api-key:ro
    # The gateway on the system network; Keycloak at its public name through Traefik.
    networks: [system, traefik-public]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
    deploy:
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefik-public
        traefik.http.routers.chat.rule: Host(`chat.${DOMAIN}`)
        traefik.http.routers.chat.entrypoints: websecure
        traefik.http.routers.chat.tls: "true"
        traefik.http.services.chat.loadbalancer.server.port: "8080"

secrets:
  openwebui-oidc-secret: { external: true }
  openwebui-secret-key: { external: true }
  admin-password: { external: true }
  tls-cert: { external: true }

networks:
  system:
    external: true
    name: homecloud-system
  traefik-public:
    external: true
