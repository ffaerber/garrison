# Login proxy: the login check for private environments and for tools without
# their own login. Traefik asks it about every request to a route that uses the
# `sso@file` middleware; it sends people without a session to Keycloak.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.${DOMAIN}/realms/homecloud
      OAUTH2_PROXY_PROVIDER_CA_FILES: /run/secrets/tls.crt
      OAUTH2_PROXY_CLIENT_ID: sso
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/sso-oidc-secret
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_REDIRECT_URL: https://sso.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/sso-cookie-secret
      # One session for every hostname of the installation.
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Answer Traefik's check itself: 202 with a session, a redirect without.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # A Keycloak access token for this client (Open WebUI's carry it as an
      # audience) also counts as signed in: an agent's browser, as the person.
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
    secrets:
      - sso-oidc-secret
      - sso-cookie-secret
      - { source: tls-cert, target: tls.crt }
    networks: [traefik-public]
    deploy:
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefik-public
        traefik.http.routers.sso.rule: Host(`sso.${DOMAIN}`)
        traefik.http.routers.sso.entrypoints: websecure
        traefik.http.routers.sso.tls: "true"
        traefik.http.services.sso.loadbalancer.server.port: "4180"

secrets:
  sso-oidc-secret: { external: true }
  sso-cookie-secret: { external: true }
  tls-cert: { external: true }

networks:
  traefik-public:
    external: true
