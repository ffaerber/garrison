services:
    admin:
        image: example/jellyfin-admin:1.0
        networks:
            - default
            - traefik-public
        deploy:
            labels:
                garrison.app: jellyfin
                garrison.environment: main
                garrison.unit: media
                traefik.enable: "true"
                traefik.http.routers.jellyfin-admin.entrypoints: websecure
                traefik.http.routers.jellyfin-admin.rule: Host(`jellyfin-admin.example.com`)
                traefik.http.routers.jellyfin-admin.tls: "true"
                traefik.http.services.jellyfin-admin.loadbalancer.server.port: "8080"
                traefik.swarm.network: traefik-public
    app:
        image: jellyfin/jellyfin:10.10
        environment:
            JELLYFIN_PublishedServerUrl: https://jellyfin.example.com/
            PRICE: 5$$
        networks:
            - default
            - traefik-public
        volumes:
            - type: bind
              source: /tank/media/stacks/jellyfin/jellyfin-config
              target: /config
            - type: bind
              source: /tank/media/shares/media-library
              target: /media
              read_only: true
        secrets:
            - source: jellyfin-api-key
              target: jellyfin-api-key
        deploy:
            labels:
                garrison.app: jellyfin
                garrison.environment: main
                garrison.unit: media
                traefik.enable: "true"
                traefik.http.routers.jellyfin.entrypoints: websecure
                traefik.http.routers.jellyfin.rule: Host(`jellyfin.example.com`)
                traefik.http.routers.jellyfin.tls: "true"
                traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
                traefik.swarm.network: traefik-public
            resources:
                limits:
                    memory: 4g
                reservations:
                    generic_resources:
                        - discrete_resource_spec:
                            kind: GPU
                            value: 1
    redis:
        image: redis:7
        networks:
            - default
        deploy:
            labels:
                garrison.app: jellyfin
                garrison.environment: main
                garrison.unit: media
networks:
    traefik-public:
        external: true
secrets:
    jellyfin-api-key:
        external: true
        name: jellyfin.jellyfin-api-key
