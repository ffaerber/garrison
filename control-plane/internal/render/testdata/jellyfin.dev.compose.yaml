services:
    admin:
        image: example/jellyfin-admin:1.0
        networks:
            - default
            - traefik-public
        deploy:
            labels:
                homecloud.app: jellyfin
                homecloud.environment: dev
                homecloud.namespace: media
                traefik.enable: "true"
                traefik.http.routers.dev-jellyfin-admin.entrypoints: websecure
                traefik.http.routers.dev-jellyfin-admin.middlewares: sso@file
                traefik.http.routers.dev-jellyfin-admin.rule: Host(`dev-jellyfin-admin.example.com`)
                traefik.http.routers.dev-jellyfin-admin.tls: "true"
                traefik.http.services.dev-jellyfin-admin.loadbalancer.server.port: "8080"
                traefik.swarm.network: traefik-public
    app:
        image: jellyfin/jellyfin:10.10
        environment:
            JELLYFIN_PublishedServerUrl: https://dev-jellyfin.example.com/
            PRICE: 5$$
        networks:
            - default
            - traefik-public
        volumes:
            - type: bind
              source: /tank/media/stacks/dev-jellyfin/jellyfin-config
              target: /config
            - type: bind
              source: /tank/media/shares/media-library
              target: /media
              read_only: true
        secrets:
            - source: jellyfin-api-key
              target: jellyfin-api-key
        deploy:
            labels:
                homecloud.app: jellyfin
                homecloud.environment: dev
                homecloud.namespace: media
                traefik.enable: "true"
                traefik.http.routers.dev-jellyfin.entrypoints: websecure
                traefik.http.routers.dev-jellyfin.middlewares: sso@file
                traefik.http.routers.dev-jellyfin.rule: Host(`dev-jellyfin.example.com`)
                traefik.http.routers.dev-jellyfin.tls: "true"
                traefik.http.services.dev-jellyfin.loadbalancer.server.port: "8096"
                traefik.swarm.network: traefik-public
            resources:
                limits:
                    memory: 4g
                reservations:
                    generic_resources:
                        - discrete_resource_spec:
                            kind: GPU
                            value: 1
    redis:
        image: redis:7
        networks:
            - default
        deploy:
            labels:
                homecloud.app: jellyfin
                homecloud.environment: dev
                homecloud.namespace: media
networks:
    traefik-public:
        external: true
secrets:
    jellyfin-api-key:
        external: true
        name: dev-jellyfin.jellyfin-api-key
